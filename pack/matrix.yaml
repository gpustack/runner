# Runner Packing Rules
#
# - backend:   (Required) The accelerated backend to pack for,
#              used to select the packing rules and Dockerfile below `pack` directory.
# - services:  (Required) The inference service to pack for,
#              used to select the service stage in `pack/${backend}/Dockerfile.${service}`.
# - platforms: (Optional) The platforms to build for,
#              used to select the Docker Linux build platforms.
#              Default to `linux/amd64` and `linux/arm64`.
# - args:      (Optional) The build arguments to pass to the Docker build,
#              used to override defaults in `pack/${backend}/Dockerfile.${service}`.

rules:

  #
  # Ascend CANN
  #

  ## Ascend CANN 9.2.1, using CANN Kernel for 950 (A5).
  ## (CANN_ARCHS follows the CANN variant name "950", while the vLLM Ascend
  ##  image tags the same generation "a5")
  ## (Omni has no A5 support yet, so it is switched off)
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2.1"
      - "CANN_ARCHS=950"
      - "PYTHON_VERSION=3.12"
      - "VLLM_VERSION=0.30.0"
      - "CANN_BASE_IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a5"
      - "VLLM_OMNI_COMMIT="
  ## Ascend CANN 9.2.1, using CANN Kernel for A3.
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2.1"
      - "CANN_ARCHS=a3"
      - "PYTHON_VERSION=3.12"
      - "VLLM_VERSION=0.30.0"
      - "CANN_BASE_IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3"
  ## Ascend CANN 9.2.1, using CANN Kernel for 910B.
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2.1"
      - "CANN_ARCHS=910b"
      - "PYTHON_VERSION=3.12"
      - "VLLM_VERSION=0.30.0"
      - "CANN_BASE_IMAGE=quay.io/ascend/vllm-ascend:v0.30.0"
  ## Ascend CANN 9.2.1, using CANN Kernel for 310P.
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2.1"
      - "CANN_ARCHS=310p"
      - "PYTHON_VERSION=3.12"
      - "VLLM_VERSION=0.30.0"
      - "CANN_BASE_IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-310p"
  ## Ascend CANN 9.1.0, SGLang 0.5.22 for A3.
  ## (no sglang upstream image for 310p variant)
  ## (910b retired: upstream publishes no 0.5.22 910b image, only 950/a3 on
  ##  cann9.1.0; re-add when an upstream 910b image returns)
  ##
  - backend: "cann"
    services:
      - "sglang"
    args:
      - "CANN_VERSION=9.1.0"
      - "CANN_ARCHS=a3"
      - "PYTHON_VERSION=3.12"
      - "SGLANG_VERSION=0.5.22"
      - "SGLANG_BASE_IMAGE=quay.io/ascend/sglang:v0.5.22-cann9.1.0-a3"
  ## Ascend CANN 9.1.0, SGLang 0.5.22 for 950 (A5).
  ## (upstream publishes v0.5.22-cann9.1.0-950 alongside the a3 image)
  ##
  - backend: "cann"
    services:
      - "sglang"
    args:
      - "CANN_VERSION=9.1.0"
      - "CANN_ARCHS=950"
      - "PYTHON_VERSION=3.12"
      - "SGLANG_VERSION=0.5.22"
      - "SGLANG_BASE_IMAGE=quay.io/ascend/sglang:v0.5.22-cann9.1.0-950"

  ## MindIE 2.3.0 retains the published CANN 8.5.0 variants.
  - backend: "cann"
    services:
      - "mindie"
    args:
      - "CANN_VERSION=8.5.0"
      - "CANN_ARCHS=a3"
      - "MINDIE_VERSION=2.3.0"
  - backend: "cann"
    services:
      - "mindie"
    args:
      - "CANN_VERSION=8.5.0"
      - "CANN_ARCHS=910b"
      - "MINDIE_VERSION=2.3.0"
  - backend: "cann"
    services:
      - "mindie"
    args:
      - "CANN_VERSION=8.5.0"
      - "CANN_ARCHS=310p"
      - "MINDIE_VERSION=2.3.0"

  #
  # AMD ROCm
  #

  ## AMD ROCm 7.2.3
  ##
  - backend: "rocm"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "ROCM_VERSION=7.2.3"
      - "VLLM_VERSION=0.32.0"
      - "VLLM_BASE_IMAGE=vllm/vllm-openai-rocm:v0.32.0"
  ## AMD ROCm 7.2.1 - SGLang 0.5.22 (rocm720-mi30x)
  ##
  - backend: "rocm"
    services:
      - "sglang"
    platforms:
      - "linux/amd64"
    args:
      - "ROCM_VERSION=7.2.1"
      - "SGLANG_VERSION=0.5.22"
      - "SGLANG_BASE_IMAGE=lmsysorg/sglang:v0.5.22-rocm720-mi30x"

  #
  # NVIDIA CUDA
  #

  ## NVIDIA CUDA 13.0.1
  ##
  - backend: "cuda"
    services:
      - "vllm"
    args:
      - "CUDA_VERSION=13.0.3"
      - "VLLM_VERSION=0.32.0"
      - "VLLM_BASE_IMAGE=vllm/vllm-openai:v0.32.0-ubuntu2404"
  ## NVIDIA CUDA 13.0.3 - SGLang 0.5.22
  ## (upstream publishes no cu129 image for 0.5.22, so only the cu130 rule remains)
  ##
  - backend: "cuda"
    services:
      - "sglang"
    args:
      - "CUDA_VERSION=13.0.3"
      - "SGLANG_VERSION=0.5.22"
      - "SGLANG_BASE_IMAGE=lmsysorg/sglang:v0.5.22-cu130"
  ## NVIDIA CUDA 12.9.1
  ## The upstream cu129 image pairs torch 2.13.0+cu129 with the 12.9 toolkit, but
  ## bundles a CUDA 13-built torchcodec that crashes `vllm serve` at import
  ## (vllm-project/vllm#60406); VLLM_TORCHCODEC_VERSION replaces it with the CPU
  ## build —— see pack/cuda/Dockerfile.vllm. LMCache 0.5.x is unaffected by
  ## upstream's cu12 lmcache==0.4.4 pin (kv_connectors_cu12.txt), which exists
  ## because the 0.5.x PyPI wheels declare CUDA 13 dependencies; we compile
  ## LMCache from source against the base's own torch instead.
  ##
  - backend: "cuda"
    services:
      - "vllm"
    args:
      - "CUDA_VERSION=12.9.1"
      - "VLLM_VERSION=0.32.0"
      - "VLLM_BASE_IMAGE=vllm/vllm-openai:v0.32.0-cu129-ubuntu2404"
      - "VLLM_TORCHCODEC_VERSION=0.17.0"

  ## VoxBox 0.0.21 retains CUDA 12.8.1 and Torch 2.7.1's cu128 wheels.
  - backend: "cuda"
    services:
      - "voxbox"
    args:
      - "CUDA_VERSION=12.8.1"
      - "VOXBOX_VERSION=0.0.21"

  #
  # Iluvatar CoreX
  #
  ##
  ## Use pack flow's arguments to override the default COREX version and version extra,
  ## which are used in `pack/corex/Dockerfile.vllm` to construct the image tags and build arguments.
  ##
  - backend: "corex"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "COREX_VERSION="
      - "VLLM_VERSION="

  #
  # Hygon DTK
  #
  ##
  ## Use pack flow's arguments to override the default DTK version and version extra,
  ## which are used in `pack/dtk/Dockerfile.vllm` and `pack/dtk/Dockerfile.sglang`
  ## to construct the image tags and build arguments.
  ##
  - backend: "dtk"
    services:
      - "vllm"
      - "sglang"
    platforms:
      - "linux/amd64"

  #
  # T-Head HGGC
  #
  ##
  ## Use pack flow's arguments to override the default HGGC version and version extra,
  ## which are used in `pack/hggc/Dockerfile.vllm` and `pack/hggc/Dockerfile.sglang`
  ## to construct the image tags and build arguments.
  ##
  ## Get HGGC version via `VERSION=$(cat /usr/local/PPU_SDK/include/hggc.h | grep HGGC_VERSION | grep define | cut -d' ' -f3); echo "$(( ${VERSION} / 1000 )).$(( ${VERSION} % 1000 / 10 )).$(( ${VERSION} % 10 ))"`
  - backend: "hggc"
    services:
      - "vllm"
      - "sglang"
    platforms:
      - "linux/amd64"

  #
  # MateX MACA
  #
  ##
  ## Use pack flow's arguments to override the default MACA version and version extra,
  ## which are used in `pack/maca/Dockerfile.vllm` and `pack/maca/Dockerfile.sglang`
  ## to construct the image tags and build arguments.
  ##
  - backend: "maca"
    services:
      - "vllm"
      - "sglang"
    platforms:
      - "linux/amd64"

  #
  # MThreads MUSA
  #
  ##
  ## Use pack flow's arguments to override the default MUSA version and version extra,
  ## which are used in `pack/musa/Dockerfile.vllm` and `pack/musa/Dockerfile.sglang`
  ## to construct the image tags and build arguments.
  ##
  - backend: "musa"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "MUSA_VERSION=4.1.0"
      - "MUSA_VERSION_EXTRA="
      - "VLLM_VERSION=0.9.2"
  - backend: "musa"
    services:
      - "sglang"
    platforms:
      - "linux/amd64"
    args:
      - "MUSA_VERSION=4.3.2"
      - "MUSA_VERSION_EXTRA="
      - "SGLANG_VERSION=0.5.7"
