# Canonical package keys allowed to select a prerelease version when
# evidence shows it is the active or required line for the selected
# combination. Auto-sync reads this list from the frozen default checkout,
# so a proposal cannot grant itself permission.
# Valid keys: lmcache, mooncake, lmcache-ascend, vllm-omni, diffusers,
# vllm-ascend (the CANN plugin).
packages:
  - lmcache
  - lmcache-ascend
  - vllm-ascend
  - vllm-omni
