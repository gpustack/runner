rules:

  #
  # vllm-omni registers stub ``humming`` modules in sys.modules at import time
  # (vllm_omni/quantization/factory.py::_register_humming_stubs). The stubs are
  # bare ModuleType objects, so their __spec__ is None, and vllm's
  # has_humming() probe then dies in importlib.util.find_spec with
  # "ValueError: humming.__spec__ is None". The stub is obsolete: vllm's lazy
  # facade (vllm.utils.humming, present since vLLM 0.27.1) keeps
  # `from .humming import HummingConfig` importable without the wheel.
  # humming-kernels is CUDA-only; the probe noise is what ROCm and CANN images
  # carry, and those are the tags below. CUDA images are deliberately
  # untouched: they install the real humming-kernels and show no problem.
  #

  #
  # AMD ROCm 7.2 (amd64 only).
  #
  - backend: "rocm"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "ROCM_VERSION=7.2"
      - "VLLM_VERSION=0.29.0"
  - backend: "rocm"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "ROCM_VERSION=7.2"
      - "VLLM_VERSION=0.30.0"
  - backend: "rocm"
    services:
      - "vllm"
    platforms:
      - "linux/amd64"
    args:
      - "ROCM_VERSION=7.2"
      - "VLLM_VERSION=0.31.0"

  #
  # Ascend CANN. The 950 variant ships no vllm-omni, so it is not listed.
  #

  ## CANN 9.1.
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=910b"
      - "VLLM_VERSION=0.27.1"
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=910b"
      - "VLLM_VERSION=0.30.0"
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=a3"
      - "VLLM_VERSION=0.27.1"
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=a3"
      - "VLLM_VERSION=0.30.0"
  - backend: "cann"
    services:
      - "vllm"
    platforms:
      - "linux/arm64"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=310p"
      - "VLLM_VERSION=0.27.1"
  - backend: "cann"
    services:
      - "vllm"
    platforms:
      - "linux/arm64"
    args:
      - "CANN_VERSION=9.1"
      - "CANN_ARCHS=310p"
      - "VLLM_VERSION=0.30.0"

  ## CANN 9.2.
  ##
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2"
      - "CANN_ARCHS=910b"
      - "VLLM_VERSION=0.30.0"
  - backend: "cann"
    services:
      - "vllm"
    args:
      - "CANN_VERSION=9.2"
      - "CANN_ARCHS=a3"
      - "VLLM_VERSION=0.30.0"
  - backend: "cann"
    services:
      - "vllm"
    platforms:
      - "linux/arm64"
    args:
      - "CANN_VERSION=9.2"
      - "CANN_ARCHS=310p"
      - "VLLM_VERSION=0.30.0"
