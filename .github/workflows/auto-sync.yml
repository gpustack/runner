name: Auto Sync

on:
  schedule:
    # Weekly, Sunday 21:07 in Asia/Shanghai (13:07 UTC).
    - cron: "7 13 * * 0"
  workflow_dispatch:
    inputs:
      # Choice large GitHub hosted runner.
      runner_profile:
        description: 'Runner profile, which profile to use for the runner.'
        required: false
        type: choice
        default: 'normal'
        options:
          - normal
          - 4x
          - 8x
      dry-run:
        description: 'Dry run, compile and validate the taskpack without invoking the model delegate or publishing a PR.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force sync execution even when upstream state appears unchanged.'
        required: false
        type: boolean
        default: false
      # Failure diagnosis.
      pack-run-url:
        description: 'Pack run URL, a failed Pack workflow run for this sync to diagnose.'
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-auto-sync
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.action == 'created' && github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/auto-sync') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.runner_profile && inputs.runner_profile != 'normal' && format('ubuntu-24.04-{0}', inputs.runner_profile) || vars.AUTOSYNC_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main ref
        id: main_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Refusing workflow_dispatch from '${DISPATCH_REF}'; dispatch Auto Sync from refs/heads/${DEFAULT_BRANCH}." >&2
            exit 1
          fi
          MAIN_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          echo "sha=${MAIN_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Fetch PR head
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_MAIN_SHA: ${{ steps.main_ref.outputs.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number '${PR_NUMBER}' in issue_comment payload." >&2
            exit 1
          fi
          if [[ -n "${GH_TOKEN}" ]]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\r\n')"
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}" \
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          else
            git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules origin \
              "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          fi
          if [[ "$(git rev-parse --verify 'HEAD^{commit}')" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "HEAD moved unexpectedly during pull request head fetch." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree became dirty after pull request object fetch." >&2
            exit 1
          fi
      - name: Install validator dependencies
        if: ${{ !inputs.dry-run }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml python3-packaging
          /usr/bin/python3 -c 'import yaml, packaging.version'
      - name: Cache research tools
        if: ${{ !inputs.dry-run }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/auto-sync-tools
          key: auto-sync-tools-v1-${{ runner.os }}-${{ runner.arch }}-ghmcp-2.0.1-crane-0.21.9
      - name: Setup research tools
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/auto-sync-tools"
          mkdir -p "$tool_dir"
          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              ghmcp_url="https://github.com/github/github-mcp-server/releases/download/v2.0.1/github-mcp-server_Linux_x86_64.tar.gz"
              ghmcp_sha="f39c3cf56e9b2883b64e30215a48a120d911e4ed0cd6a83dddae1260279b02e6"
              crane_url="https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_x86_64.tar.gz"
              crane_sha="5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
              ;;
            aarch64|arm64)
              ghmcp_url="https://github.com/github/github-mcp-server/releases/download/v2.0.1/github-mcp-server_Linux_arm64.tar.gz"
              ghmcp_sha="f7efcb41853153e2bf45df92a0a18b585b0bc21fcbf9c00bf667f48ff9743c87"
              crane_url="https://github.com/google/go-containerregistry/releases/download/v0.21.9/go-containerregistry_Linux_arm64.tar.gz"
              crane_sha="1f4c647b7bb260ab5435661df5b526cf59950ebf95201790db7183ac189cbcbd"
              ;;
            *)
              echo "Unsupported runner architecture: $arch" >&2
              exit 1
              ;;
          esac
          if [[ ! -x "$tool_dir/github-mcp-server" ]]; then
            tmp_ghmcp="$(mktemp -d)"
            curl -fsSL --retry 3 "$ghmcp_url" -o "$tmp_ghmcp/ghmcp.tar.gz"
            echo "${ghmcp_sha}  $tmp_ghmcp/ghmcp.tar.gz" | sha256sum -c -
            tar -xzf "$tmp_ghmcp/ghmcp.tar.gz" -C "$tmp_ghmcp" github-mcp-server
            install -m 0755 "$tmp_ghmcp/github-mcp-server" "$tool_dir/github-mcp-server"
            rm -rf "$tmp_ghmcp"
          fi
          if [[ ! -x "$tool_dir/crane" ]]; then
            tmp_crane="$(mktemp -d)"
            curl -fsSL --retry 3 "$crane_url" -o "$tmp_crane/crane.tar.gz"
            echo "${crane_sha}  $tmp_crane/crane.tar.gz" | sha256sum -c -
            tar -xzf "$tmp_crane/crane.tar.gz" -C "$tmp_crane" crane
            install -m 0755 "$tmp_crane/crane" "$tool_dir/crane"
            rm -rf "$tmp_crane"
          fi
          sudo install -m 0755 "$tool_dir/github-mcp-server" "$tool_dir/crane" /usr/local/bin/
          github-mcp-server --version
          crane version
      - name: Run Loopwright
        id: loopwright
        uses: gpustack/loopwright@9fc93a1f0b48844f24d76dafb16575fd562947aa # v0.0.1
        with:
          taskpack-path: .auto-sync/taskpack.yaml
          mode: auto
          allow-privileged-execution: 'false'
          allow-workflow-writes: 'false'
          event-name: ${{ github.event_name }}
          event-path: ${{ github.event_path }}
          run-root: ${{ runner.temp }}/loopwright-runs
          run-id: auto-sync-${{ github.run_id }}-${{ github.run_attempt }}
          storage-profile: actions-basic
          github-app-id: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_ID || vars.CI_GPUSTACK_LOOPWRIGHT_APP_ID }}
          github-app-private-key: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_APP_PRIVATE_KEY }}
          output: json,github-step-summary
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
          force: ${{ (inputs.force || inputs.pack-run-url != '') && 'true' || 'false' }}
        env:
          GITHUB_SHA: ${{ steps.main_ref.outputs.sha }}
          LOOPWRIGHT_PROVIDER_TOKEN: ${{ secrets.CI_GPUSTACK_LOOPWRIGHT_LLM_AUTH_TOKEN || secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN || secrets.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACK_RUN_URL: ${{ inputs.pack-run-url }}
          PYTHON_BIN: /usr/bin/python3
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-sync-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/loopwright-runs/**/run.json
            ${{ runner.temp }}/loopwright-runs/**/memory-publication.json
            ${{ runner.temp }}/loopwright-runs/**/artifacts/**/*.json
            ${{ runner.temp }}/loopwright-runs/lw-action-*/config/config.yaml
            ${{ runner.temp }}/loopwright-runs/lw-action-*/registry/registry.yaml
            ${{ runner.temp }}/loopwright-runs/lw-action-*/registry/.loopwright-baseline/conflicts.json
            !${{ runner.temp }}/loopwright-runs/**/secrets.json
            !${{ runner.temp }}/loopwright-runs/**/*.sqlite*
          retention-days: 30
          if-no-files-found: ignore
