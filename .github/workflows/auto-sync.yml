name: Runner Auto Sync

on:
  schedule:
    # Weekly, Sunday 21:07 in Asia/Shanghai (13:07 UTC).
    - cron: "7 13 * * 0"
  workflow_dispatch:
    inputs:
      # Choice large GitHub hosted runner.
      runner_profile:
        description: 'Runner profile, which profile to use for the runner.'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - 4x
          - 8x
      dry-run:
        description: 'Dry run, compile and validate the taskpack without invoking the model delegate or publishing a PR.'
        required: false
        type: boolean
        default: false
      # Model behavior.
      llm-thinking:
        description: 'LLM thinking, the provider thinking switch.'
        required: false
        type: choice
        default: enabled
        options:
          - disabled
          - enabled
      llm-temperature:
        description: 'LLM temperature, the sampling temperature.'
        required: false
        type: string
        default: "0.4"
      llm-top-p:
        description: 'LLM top-p, the top-p sampling value.'
        required: false
        type: string
        default: "0.9"
      llm-max-tokens:
        description: 'LLM max tokens, the per-reply output token ceiling.'
        required: false
        type: string
        default: "65536"
      llm-reasoning-effort:
        description: 'LLM reasoning effort, the reasoning effort level.'
        required: false
        type: choice
        default: high
        options:
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
      # Failure diagnosis.
      pack-run-url:
        description: 'Pack run URL, a failed Pack workflow run for this sync to diagnose.'
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.repository }}-auto-sync
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.action == 'created' && github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/auto-sync') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ inputs.runner_profile && inputs.runner_profile != 'normal' && format('ubuntu-24.04-{0}', inputs.runner_profile) || vars.AUTOSYNC_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.24"
          enable-cache: true
          python-version: "3.10"
      - name: Install locked Python dependencies
        run: |
          make prepare
          uv sync --locked --all-packages
      - name: Create repository App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_PRT_GENERATOR_ID }}
          private-key: ${{ secrets.CI_PRT_GENERATOR_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare optional LLM gateway overrides
        id: model-config
        env:
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_URL: ${{ vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_URL }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_MODEL: ${{ vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_MODEL }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_PROTOCOL: ${{ vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_PROTOCOL }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_USE_ANTHROPIC: ${{ vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_USE_ANTHROPIC }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_THINKING: ${{ inputs.llm-thinking || vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_THINKING }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_TEMPERATURE: ${{ inputs.llm-temperature || vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_TEMPERATURE }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_TOP_P: ${{ inputs.llm-top-p || vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_TOP_P }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_MAX_TOKENS: ${{ inputs.llm-max-tokens || vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_MAX_TOKENS }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_REASONING_EFFORT: ${{ inputs.llm-reasoning-effort || vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_REASONING_EFFORT }}
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_CONTEXT_WINDOW_SIZE: ${{ vars.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_CONTEXT_WINDOW_SIZE }}
        run: |
          uv run python .auto-sync/checks/write_models_json.py \
            --output "$RUNNER_TEMP/loopwright-models.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Run Loopwright auto-sync
        id: loopwright
        uses: gpustack/loopwright@main
        with:
          taskpack-path: .auto-sync/taskpack.yaml
          mode: candidate
          event-name: ${{ github.event_name }}
          event-path: ${{ github.event_path }}
          run-root: ${{ runner.temp }}/loopwright-runs
          run-id: auto-sync-${{ github.run_id }}-${{ github.run_attempt }}
          storage-profile: actions-basic
          provider: ${{ steps.model-config.outputs.provider }}
          model: ${{ steps.model-config.outputs.model }}
          thinking: ${{ steps.model-config.outputs.thinking }}
          api: ${{ steps.model-config.outputs.api }}
          base-url: ${{ steps.model-config.outputs.base-url }}
          models-json: ${{ steps.model-config.outputs.models-json }}
          allow-custom-base-url: 'true'
          provider-token-env: CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_AUTH_TOKEN
          github-token: ${{ steps.app-token.outputs.token }}
          output: json,github-step-summary
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}
          publication-endpoint-url: ${{ inputs.dry-run && 'http://127.0.0.1:65535/loopwright-dry-run-publication' || '' }}
        env:
          CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_AUTH_TOKEN: ${{ secrets.CI_GPUSTACK_RUNNER_AUTOSYNC_LLM_AUTH_TOKEN }}
          PACK_RUN_URL: ${{ inputs.pack-run-url }}
          PYTHON_BIN: ${{ github.workspace }}/.venv/bin/python
      - name: Upload Loopwright run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-sync-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loopwright-runs
          retention-days: 30
          if-no-files-found: ignore
