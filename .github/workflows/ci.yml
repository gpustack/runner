# This workflow runs for continuous integration (CI) of the project.
# It triggers on workflow dispatch or when changes are pushed to the main branch or development branches.

name: CI

permissions:
  actions: read
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  # `pack/**` is deliberately NOT ignored here or below: it is the only path a
  # broken dependency-probe wiring can arrive through, and the guard that catches
  # it is tests/pack/test_probe_wiring.py. Ignoring it buys back a few runner
  # minutes and gives up the guard entirely.
  push:
    branches:
      - "main"
      - "v*-dev"
    paths-ignore:
      - "!.github/workflows/ci.yml"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.gif"
      - "**.webp"
  pull_request:
    branches:
      - "main"
      - "v*-dev"
    paths-ignore:
      - "!.github/workflows/ci.yml"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.gif"
      - "**.webp"

jobs:
  # Execute CI jobs on Linux and macOS with different Python versions.
  ci:
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - "linux"
          - "darwin"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-24.04' || 'macos-15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup UV
        continue-on-error: true
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.24"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Make
        run: |
          make deps install lint
          uv run pytest tests/gpustack_runner tests/pack
          make clean build
        env:
          LINT_DIRTY: "true"
      - name: Upload Assets
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          path: dist/*
          name: gputack-runner-${{ matrix.os }}-${{ matrix.python-version }}

  # Validate auto-sync taskpack, candidate checks, workflows, and documentation.
  auto-sync-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.24"
          enable-cache: true
          python-version: "3.10"
      - name: Install locked Python dependencies
        run: |
          make prepare
          uv sync --locked --all-packages
      - name: Run all offline automation contracts
        run: uv run pytest tests/auto_sync
      - name: Validate workflows
        run: |
          uv run python .auto-sync/checks/lint_workflows.py \
            .github/workflows/auto-sync.yml .github/workflows/pack.yml .github/workflows/ci.yml
      - name: Validate documentation
        run: uv run mkdocs build --strict
