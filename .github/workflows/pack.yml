# This workflow packs the Docker images for the GPUStack runner.
# It builds the images based on the matrix defined in `pack/matrix.yaml`.
# It supports multiple backends and targets, and can create manifest lists for multi-arch support.
# It also supports dry runs to check the matrix and Dockerfile without building images.
# The workflow is triggered manually via the GitHub Actions UI.

name: Pack

permissions:
  actions: write
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      # Post operation for mutating a released image.
      post_operation:
        description: 'Post operation (dangerous), which operation to use for mutating a released image.'
        required: false
        type: string
      # Control the Dockerfile and build context.
      backend:
        description: 'Backend, which accelerated backend to pack for.'
        required: false
        type: choice
        default: all
        options:
          - all
          - cann
          - corex
          - cuda
          - dtk
          - hggc
          - maca
          - musa
          - rocm
      # Control the build stage.
      target:
        description: 'Target, which target to pack for.'
        required: false
        type: choice
        default: vllm
        options:
          - voxbox
          - mindie
          - vllm
          - sglang
      # Since specific Backend and Target still result in many tags,
      # we can leverage this to control packing one specific tag, even os/arch.
      tag:
        description: 'Tag (ignore -dev suffix), which tag to pack for. Pack all tags given by Backend and Target if not specified.'
        required: false
        type: string
        default: ""
      # Allow to pass arguments to the building,
      # but recommended to code into the matrix.yaml.
      args:
        description: 'Arguments (using space to separate multiple items), which build arguments use for packing.'
        required: false
        type: string
        default: ""
      # Debug.
      dry_run:
        description: 'Dry run, print matrix and check the Dockerfile.'
        required: false
        type: boolean
        default: false
      # Do not append a `-dev` suffix to the tag.
      for_release:
        description: 'For release (without -dev suffix).'
        required: false
        type: boolean
        default: false
      # Ignore --cache-from.
      with_cache:
        description: 'With cache, specially meaning cache from previous built result.'
        required: false
        type: boolean
        default: true
      # Choice large GitHub hosted runner.
      runner_profile:
        description: 'Runner profile, which profile to use for the runner.'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - 8x
          - 16x
          - 32x
      # Clean the runner before packing.
      runner_clean:
        description: 'Runner clean before packing, which means to clean the runner before packing. Always be true if runner profile is "normal".'
        required: false
        type: boolean
        default: false

env:
  INPUT_USERNAME: gpustack
  INPUT_PASSWORD: ${{ secrets.CI_DOCKERHUB_PASSWORD }}
  INPUT_NAMESPACE: gpustack
  INPUT_REPOSITORY: runner
  INPUT_CACHE_REPOSITORY: runner-build-cache

jobs:
  # Expand the matrix based on the input parameters.
  expand-matrix:
    runs-on: ubuntu-22.04
    outputs:
      build_jobs: ${{ steps.expand-matrix.outputs.build_jobs }}
      manifest_jobs: ${{ steps.expand-matrix.outputs.manifest_jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Expand Matrix
        id: expand-matrix
        env:
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
          INPUT_BACKEND: ${{ github.event.inputs.backend }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ARGS: ${{ github.event.inputs.args }}
          INPUT_FOR_RELEASE: ${{ github.event.inputs.for_release }}
          INPUT_RUNNER_PROFILE: ${{ github.event.inputs.runner_profile }}
          INPUT_WORKSPACE: ${{ github.workspace }}/pack
          INPUT_TEMPDIR: ${{ runner.temp }}
        run: ${{ github.workspace }}/pack/expand_matrix.sh

  # Build the Docker images per OS/ARCH.
  build:
    timeout-minutes: 360
    needs:
      - expand-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.expand-matrix.outputs.build_jobs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false
      - name: Maximize Docker Build Space
        if: ${{ github.event.inputs.dry_run == 'false' && (github.event.inputs.runner_clean == 'true' || github.event.inputs.runner_profile == 'normal') }}
        uses: gpustack/.github/.github/actions/maximize-docker-build-space@main
        with:
          deep-clean: true
          root-reserve-mb: 20480
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
          buildkitd-flags: |
            --allow-insecure-entitlement=network.host
            --allow-insecure-entitlement=security.insecure
            --oci-worker-net=host
            --oci-worker-gc-keepstorage=204800
      - name: Login DockerHub
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.INPUT_USERNAME }}
          password: ${{ env.INPUT_PASSWORD }}
      - name: Get Metadata
        id: metadata
        env:
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
          INPUT_WITH_CACHE: ${{ github.event.inputs.with_cache }}
          INPUT_PLATFORM_TAG: ${{ matrix.platform_tag }}
          INPUT_PLATFORM_TAG_CACHE: ${{ join(matrix.platform_tag_cache, ' ') }}
          INPUT_ARGS: ${{ join(matrix.args, ' ') }}
        run: |
          #!/usr/bin/env bash

          set -eo pipefail

          # Export tags to GH output.
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${INPUT_PLATFORM_TAG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Export build_args to GH output.
          echo "build_args<<EOF" >> $GITHUB_OUTPUT
          for arg in ${INPUT_ARGS}; do
            echo "${arg}" >> $GITHUB_OUTPUT
          done
          echo "EOF" >> $GITHUB_OUTPUT

          # Export cache_from to GH output.
          echo "cache_from<<EOF" >> $GITHUB_OUTPUT
          if [[ "${INPUT_WITH_CACHE}" == "true" ]]; then
            for tag_cache in ${INPUT_PLATFORM_TAG_CACHE}; do
              echo "type=registry,ref=${INPUT_NAMESPACE}/${INPUT_CACHE_REPOSITORY}:${tag_cache}" >> $GITHUB_OUTPUT
            done
          fi
          echo "EOF" >> $GITHUB_OUTPUT

          # Export cache_to to GH output.
          echo "cache_to<<EOF" >> $GITHUB_OUTPUT
          if [[ -z "${INPUT_POST_OPERATION}" ]]; then
            for tag_cache in ${INPUT_PLATFORM_TAG_CACHE}; do
              echo "type=registry,ignore-error=true,mode=max,compression=gzip,ref=${INPUT_NAMESPACE}/${INPUT_CACHE_REPOSITORY}:${tag_cache}" >> $GITHUB_OUTPUT
            done
          fi
          echo "EOF" >> $GITHUB_OUTPUT

          DOCKER_CONTEXT="${{ github.workspace }}/pack${{ github.event.inputs.post_operation && format('/.post_operation/{0}', github.event.inputs.post_operation) || '' }}/${{ matrix.backend }}"
          echo "docker_context=${DOCKER_CONTEXT}" >> $GITHUB_OUTPUT

          DOCKER_FILE="${DOCKER_CONTEXT}/Dockerfile"
          if [[ -f ${DOCKER_FILE}.${{ matrix.service }} ]]; then
            DOCKER_FILE="${DOCKER_FILE}.${{ matrix.service }}"
          fi
          echo "docker_file=${DOCKER_FILE}" >> $GITHUB_OUTPUT

          # Report whether this Dockerfile exposes the dependency export stage.
          #
          # Only post operations are gated on this. The ones predating dependency
          # probing have no `<service>-deps` stage, and exporting it would fail the
          # run -- after the image was already pushed. Skipping leaves the recorded
          # dependencies stale but never wrong, since `pack/merge_runner.sh` only
          # updates the entries it actually probed. The normal path is never gated,
          # so a backend Dockerfile that drops the stage still fails loudly.
          HAS_DEPENDENCIES_STAGE=false
          if grep -qiE "^[[:space:]]*FROM[[:space:]]+.*[[:space:]]+AS[[:space:]]+${{ matrix.service }}-deps([[:space:]]|#|$)" "${DOCKER_FILE}"; then
            HAS_DEPENDENCIES_STAGE=true
          fi
          echo "[INFO]: dependency export stage '${{ matrix.service }}-deps' present in ${DOCKER_FILE}: ${HAS_DEPENDENCIES_STAGE}"
          echo "has_dependencies_stage=${HAS_DEPENDENCIES_STAGE}" >> $GITHUB_OUTPUT

          # Flatten the whitelist into the build argument consumed by
          # pack/shared/probe_dependencies.sh. An empty one must fail the job here:
          # the script treats empty as "skip probing", the escape hatch for manual
          # local builds, which in CI would silently ship an unprobed image.
          DEPENDENCY_PACKAGES="$(jq -er '[.[][]] | join(" ")' "${{ github.workspace }}/pack/dependencies.json")"
          # Match on "has a non-whitespace character" rather than stripping spaces:
          # `${VAR// /}` strips spaces only, so a tab would pass as non-empty.
          if [[ ! "${DEPENDENCY_PACKAGES}" =~ [^[:space:]] ]]; then
            echo "[ERROR]: empty dependency whitelist from 'pack/dependencies.json'" >&2
            exit 1
          fi
          echo "[INFO]: dependency packages ($(echo "${DEPENDENCY_PACKAGES}" | wc -w | tr -d ' ')): ${DEPENDENCY_PACKAGES}"
          echo "dependency_packages=${DEPENDENCY_PACKAGES}" >> $GITHUB_OUTPUT
      - name: Package
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          allow: |
            network.host
            security.insecure
          call: ${{ github.event.inputs.dry_run == 'true' && 'check' || 'build' }}
          ulimit: |
            nofile=65536:65536
          shm-size: '16G'
          push: ${{ github.event.inputs.dry_run == 'false' }}
          provenance: false
          sbom: false
          context: ${{ steps.metadata.outputs.docker_context }}
          file: ${{ steps.metadata.outputs.docker_file }}
          # Carries pack/shared/, which every backend Dockerfile mounts to reach
          # the probe script. The build context itself stays pack/<backend>/.
          build-contexts: |
            shared=${{ github.workspace }}/pack/shared
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.service }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          build-args: |
            ${{ steps.metadata.outputs.build_args }}
            DEPENDENCY_PACKAGES=${{ steps.metadata.outputs.dependency_packages }}
          cache-from: |
            ${{ steps.metadata.outputs.cache_from }}
          cache-to: |
            ${{ steps.metadata.outputs.cache_to }}
      # Pull the probed versions out of the build that just ran: a second build of
      # the same Dockerfile targeting the `FROM scratch` export stage, because a
      # build can only have one target. It runs on the same builder, so it hits the
      # Package step's cache instead of re-running the business layers, and needs no
      # `docker pull`. It exports no cache -- Package already wrote it.
      #
      # A dry run runs it as a `check` call, which is the only thing that verifies
      # the `<service>-deps` stage exists and is well formed. That produces no file
      # and uploads nothing.
      - name: Export Dependencies
        if: ${{ github.event.inputs.post_operation == '' || steps.metadata.outputs.has_dependencies_stage == 'true' }}
        uses: docker/build-push-action@v6
        with:
          allow: |
            network.host
            security.insecure
          call: ${{ github.event.inputs.dry_run == 'true' && 'check' || 'build' }}
          # Must stay byte-identical to the Package step: these land in the LLB
          # definition, so a mismatch changes every following RUN's digest, misses
          # the cache Package just populated, and exports a dependencies.json
          # describing an image that was never pushed. Change one, change both.
          ulimit: |
            nofile=65536:65536
          shm-size: '16G'
          push: false
          provenance: false
          sbom: false
          context: ${{ steps.metadata.outputs.docker_context }}
          file: ${{ steps.metadata.outputs.docker_file }}
          build-contexts: |
            shared=${{ github.workspace }}/pack/shared
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.service }}-deps
          build-args: |
            ${{ steps.metadata.outputs.build_args }}
            DEPENDENCY_PACKAGES=${{ steps.metadata.outputs.dependency_packages }}
          cache-from: |
            ${{ steps.metadata.outputs.cache_from }}
          outputs: ${{ github.event.inputs.dry_run == 'false' && format('type=local,dest={0}/dependencies', runner.temp) || '' }}
      # The artifact name carries the platform tag, unique per (platform, tag)
      # within a run: that is the key `merge_runner.sh` relates probes back with.
      - name: Upload Dependencies
        if: ${{ github.event.inputs.dry_run == 'false' && (github.event.inputs.post_operation == '' || steps.metadata.outputs.has_dependencies_stage == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ matrix.platform_tag }}
          path: ${{ runner.temp }}/dependencies/dependencies.json
          # `upload-artifact@v4` answers a duplicate name with a non-retryable 409.
          # `build` carries `timeout-minutes: 360`, so "Re-run all jobs" is routine
          # here, and without this every re-run leg would fail after pushing.
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  # Merge all architecture images into manifest list.
  manifest:
    if: ${{ github.event.inputs.dry_run == 'false' }}
    needs:
      - expand-matrix
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.INPUT_USERNAME }}
          password: ${{ env.INPUT_PASSWORD }}
      - name: Manifest
        env:
          INPUT_MANIFEST_JOBS: ${{ needs.expand-matrix.outputs.manifest_jobs }}
        run: |
          #!/usr/bin/env bash

          set -eo pipefail

          # Iterate all items of manifest jobs.
          for TAG in $(echo "${INPUT_MANIFEST_JOBS}" | jq -r 'keys[]'); do
              PLATFORM_TAGS="$(echo "${INPUT_MANIFEST_JOBS}" | jq -r \
                --arg tag "${TAG}" \
                --arg repo "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}" \
                '.[$tag] | map($repo + ":" + .) | join(" ")')"
              echo "[INFO]: Creating manifest '${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${TAG}' with '${PLATFORM_TAGS}'"
              docker manifest create --amend "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${TAG}" ${PLATFORM_TAGS}
              docker manifest inspect "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${TAG}"
              echo "[INFO]: Pushing manifest '${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${TAG}'"
              docker manifest push --purge "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${TAG}"
          done

  # Submit a PR to merge the runner.
  #
  # A post operation runs through here as well: it mutates a released image in
  # place, so the dependency versions recorded for that tag have to follow.
  # `for_release == 'true'` stays required, and doubles as the guard for it: a
  # post operation is by definition applied to released tags, and without the
  # flag every tag would carry the `-dev` suffix and address no released entry.
  merge-runner:
    if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.for_release == 'true' }}
    needs:
      - expand-matrix
      - manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download Dependencies
        uses: actions/download-artifact@v4
        with:
          pattern: dependencies-*
          path: ${{ runner.temp }}/dependencies
      - name: Merge Runner
        env:
          INPUT_BUILD_JOBS: ${{ needs.expand-matrix.outputs.build_jobs }}
          INPUT_DEPENDENCIES_DIR: ${{ runner.temp }}/dependencies
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
        run: ${{ github.workspace }}/pack/merge_runner.sh
      - name: Generate Pull Request Token
        id: generate-prt
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_PRT_GENERATOR_ID }}
          private-key: ${{ secrets.CI_PRT_GENERATOR_KEY }}
      - name: Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-prt.outputs.token }}
          branch: "create-pull-request/merge-runner-${{ github.run_id }}"
          delete-branch: true
          commit-message: "chore: update runner by gha workflow ${{ github.run_id }}"
          title: "chore: update runner by gha workflow ${{ github.run_id }}"
          reviewers: ${{ github.actor }}
          assignees: ${{ github.actor }}
          body: |
            Update runner by GHA workflow [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
