# This workflow packs the Docker images for the GPUStack runner.
# It builds the images based on the matrix defined in `pack/matrix.yaml`.
# It supports multiple backends and targets, and can create manifest lists for multi-arch support.
# It also supports dry runs to check the matrix and Dockerfile without building images.
# The workflow is triggered manually via the GitHub Actions UI.

name: Pack

# Hold one lock through image publication and catalog preparation.
concurrency:
  group: pack-publication-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      # Post operation for mutating a released image.
      post_operation:
        description: 'Post operation (dangerous), which operation to use for mutating a released image.'
        required: false
        type: string
      # Control the Dockerfile and build context.
      backend:
        description: 'Backend, which accelerated backend to pack for.'
        required: false
        type: choice
        default: all
        options:
          - all
          - cann
          - corex
          - cuda
          - dtk
          - hggc
          - maca
          - musa
          - rocm
      # Control the build stage.
      target:
        description: 'Target, which target to pack for.'
        required: false
        type: choice
        default: vllm
        options:
          - voxbox
          - mindie
          - vllm
          - sglang
      # Since specific Backend and Target still result in many tags,
      # we can leverage this to control packing one specific tag, even os/arch.
      tag:
        description: 'Tag (ignore -dev suffix), which tag to pack for. Pack all tags given by Backend and Target if not specified.'
        required: false
        type: string
        default: ""
      # Allow to pass arguments to the building,
      # but recommended to code into the matrix.yaml.
      args:
        description: 'Arguments (using space to separate multiple items), which build arguments use for packing.'
        required: false
        type: string
        default: ""
      # Debug.
      dry_run:
        description: 'Dry run, print matrix and check the Dockerfile.'
        required: false
        type: boolean
        default: false
      # Do not append a `-dev` suffix to the tag.
      for_release:
        description: 'For release (without -dev suffix).'
        required: false
        type: boolean
        default: false
      # Ignore --cache-from.
      with_cache:
        description: 'With cache, specially meaning cache from previous built result.'
        required: false
        type: boolean
        default: true
      # Choice large GitHub hosted runner.
      runner_profile:
        description: 'Runner profile, which profile to use for the runner.'
        required: false
        type: choice
        default: normal
        options:
          - normal
          - 8x
          - 16x
          - 32x
      # Clean the runner before packing.
      runner_clean:
        description: 'Runner clean before packing, which means to clean the runner before packing. Always be true if runner profile is "normal".'
        required: false
        type: boolean
        default: false

env:
  INPUT_USERNAME: gpustack
  INPUT_PASSWORD: ${{ secrets.CI_DOCKERHUB_PASSWORD }}
  INPUT_NAMESPACE: gpustack
  INPUT_REPOSITORY: runner
  INPUT_CACHE_REPOSITORY: runner-build-cache

jobs:
  # Expand the matrix based on the input parameters.
  expand-matrix:
    runs-on: ubuntu-22.04
    outputs:
      build_jobs: ${{ steps.expand-matrix.outputs.build_jobs }}
      manifest_jobs: ${{ steps.expand-matrix.outputs.manifest_jobs }}
      context: ${{ steps.freeze.outputs.context }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Expand Matrix
        id: expand-matrix
        env:
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
          INPUT_BACKEND: ${{ github.event.inputs.backend }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_ARGS: ${{ github.event.inputs.args }}
          INPUT_FOR_RELEASE: ${{ github.event.inputs.for_release }}
          INPUT_RUNNER_PROFILE: ${{ github.event.inputs.runner_profile }}
          INPUT_WORKSPACE: ${{ github.workspace }}/pack
          INPUT_TEMPDIR: ${{ runner.temp }}
        run: ${{ github.workspace }}/pack/expand_matrix.sh

      - name: Download Frozen Invocation
        if: ${{ github.run_attempt > 1 }}
        uses: actions/download-artifact@v4
        with:
          name: pack-context
          path: ${{ runner.temp }}/invocation
      - name: Freeze Invocation
        id: freeze
        env:
          BUILD_JOBS: ${{ steps.expand-matrix.outputs.build_jobs }}
          MANIFEST_JOBS: ${{ steps.expand-matrix.outputs.manifest_jobs }}
        run: |
          set -euo pipefail
          jq -n --argjson builds "$BUILD_JOBS" --argjson manifests "$MANIFEST_JOBS" \
            --arg repository "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}" \
            '{repository: $repository, build_jobs: $builds, manifest_jobs: $manifests}' >"$RUNNER_TEMP/matrix.json"
          freeze_options=()
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            freeze_options+=(--previous "$RUNNER_TEMP/invocation/context.json")
          fi
          python3 pack/collect_dependencies.py freeze --matrix "$RUNNER_TEMP/matrix.json" \
            "${freeze_options[@]}" \
            --workflow-run "$GITHUB_RUN_ID" --source-revision "$GITHUB_SHA" \
            --mapping pack/dependencies.json --output "$RUNNER_TEMP/context.json"
          echo "context=$(jq -c . "$RUNNER_TEMP/context.json")" >>"$GITHUB_OUTPUT"
      # The first attempt owns this immutable record. Missing rerun state fails closed.
      - name: Upload Frozen Invocation
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: pack-context
          path: ${{ runner.temp }}/context.json
          if-no-files-found: error
          retention-days: 30

  # Build the Docker images per OS/ARCH.
  build:
    timeout-minutes: 360
    needs:
      - expand-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.expand-matrix.outputs.build_jobs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Maximize Docker Build Space
        if: ${{ github.event.inputs.dry_run == 'false' && (github.event.inputs.runner_clean == 'true' || github.event.inputs.runner_profile == 'normal') }}
        uses: gpustack/.github/.github/actions/maximize-docker-build-space@main
        with:
          deep-clean: true
          root-reserve-mb: 20480
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1
          driver-opts: |
            network=host
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
          buildkitd-flags: |
            --allow-insecure-entitlement=network.host
            --allow-insecure-entitlement=security.insecure
            --oci-worker-net=host
            --oci-worker-gc-keepstorage=204800
      - name: Login DockerHub
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.INPUT_USERNAME }}
          password: ${{ env.INPUT_PASSWORD }}
      - name: Get Metadata
        id: metadata
        env:
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
          INPUT_WITH_CACHE: ${{ github.event.inputs.with_cache }}
          INPUT_PLATFORM_TAG: ${{ matrix.platform_tag }}
          INPUT_PLATFORM_TAG_CACHE: ${{ join(matrix.platform_tag_cache, ' ') }}
          INPUT_ARGS: ${{ join(matrix.args, ' ') }}
        run: |
          #!/usr/bin/env bash

          set -eo pipefail

          {
            # Export tags to GH output.
            echo "tags<<EOF"
            echo "${INPUT_NAMESPACE}/${INPUT_REPOSITORY}:${INPUT_PLATFORM_TAG}"
            echo "EOF"

            # Export build_args to GH output.
            echo "build_args<<EOF"
            for arg in ${INPUT_ARGS}; do
              echo "${arg}"
            done
            echo "EOF"

            # Export cache_from to GH output.
            echo "cache_from<<EOF"
            if [[ "${INPUT_WITH_CACHE}" == "true" ]]; then
              for tag_cache in ${INPUT_PLATFORM_TAG_CACHE}; do
                echo "type=registry,ref=${INPUT_NAMESPACE}/${INPUT_CACHE_REPOSITORY}:${tag_cache}"
              done
            fi
            echo "EOF"

            # Export cache_to to GH output.
            echo "cache_to<<EOF"
            if [[ -z "${INPUT_POST_OPERATION}" ]]; then
              for tag_cache in ${INPUT_PLATFORM_TAG_CACHE}; do
                echo "type=registry,ignore-error=true,mode=max,compression=gzip,ref=${INPUT_NAMESPACE}/${INPUT_CACHE_REPOSITORY}:${tag_cache}"
              done
            fi
            echo "EOF"

            DOCKER_FILE="$("${{ github.workspace }}/pack/resolve_dockerfile.sh" \
              "${{ github.workspace }}/pack" "${{ matrix.backend }}" "${{ matrix.service }}" "${INPUT_POST_OPERATION}")"
            DOCKER_CONTEXT="$(dirname "${DOCKER_FILE}")"
            echo "docker_context=${DOCKER_CONTEXT}"
            echo "docker_file=${DOCKER_FILE}"

          } >>"$GITHUB_OUTPUT"
      - name: Package
        id: package
        timeout-minutes: 360
        uses: docker/build-push-action@v6
        with:
          allow: |
            network.host
            security.insecure
          call: ${{ github.event.inputs.dry_run == 'true' && 'check' || 'build' }}
          ulimit: |
            nofile=65536:65536
          shm-size: '16G'
          push: ${{ github.event.inputs.dry_run == 'false' }}
          provenance: false
          sbom: false
          context: ${{ steps.metadata.outputs.docker_context }}
          file: ${{ steps.metadata.outputs.docker_file }}
          # Retain the old mount while active recipes still use it.
          # Historical recipes also use this context; central receipts are authoritative.
          build-contexts: |
            shared=${{ github.workspace }}/pack/shared
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.service }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          build-args: |
            ${{ steps.metadata.outputs.build_args }}
          cache-from: |
            ${{ steps.metadata.outputs.cache_from }}
          cache-to: |
            ${{ steps.metadata.outputs.cache_to }}
      - name: Record Package Output
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          INPUT_CONTEXT: ${{ needs.expand-matrix.outputs.context }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
          BUILD_JOB: ${{ matrix.platform_tag }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INPUT_CONTEXT" >"$RUNNER_TEMP/context.json"
          python3 pack/collect_dependencies.py record-build --context "$RUNNER_TEMP/context.json" \
            --mapping pack/dependencies.json --job "$BUILD_JOB" --attempt "$BUILD_ATTEMPT" \
            --digest "$PACKAGE_DIGEST" --output "$RUNNER_TEMP/build.json"
      # Replace only this job's independent Package output before collecting.
      # An old receipt cannot validate against a replacement digest or attempt.
      - name: Upload Package Output
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.platform_tag }}
          path: ${{ runner.temp }}/build.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Collect Dependencies
        id: collect
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          python3 pack/collect_dependencies.py collect-record --context "$RUNNER_TEMP/context.json" \
            --mapping pack/dependencies.json --build "$RUNNER_TEMP/build.json" \
            --output "$RUNNER_TEMP/receipt.json"
      # Preserve failures too. Partial reruns leave all other jobs' artifacts intact.
      - name: Upload Dependencies
        if: ${{ always() && github.event.inputs.dry_run == 'false' && steps.collect.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ matrix.platform_tag }}
          path: ${{ runner.temp }}/receipt.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  # Merge all architecture images into manifest list.
  manifest:
    if: ${{ github.event.inputs.dry_run == 'false' }}
    needs:
      - expand-matrix
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.INPUT_USERNAME }}
          password: ${{ env.INPUT_PASSWORD }}
      - name: Download Package Outputs
        uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          path: ${{ runner.temp }}/artifacts
      - name: Download Dependencies
        uses: actions/download-artifact@v4
        with:
          pattern: dependencies-*
          path: ${{ runner.temp }}/artifacts
      - name: Manifest
        env:
          INPUT_CONTEXT: ${{ needs.expand-matrix.outputs.context }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INPUT_CONTEXT" >"$RUNNER_TEMP/context.json"
          python3 pack/collect_dependencies.py publish --context "$RUNNER_TEMP/context.json" \
            --mapping pack/dependencies.json --artifacts "$RUNNER_TEMP/artifacts" \
            --output "$RUNNER_TEMP/manifests.json"
      - name: Upload Manifests
        uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: ${{ runner.temp }}/manifests.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  # Submit a PR to merge the runner.
  #
  # A post operation runs through here as well: it mutates a released image in
  # place, so the dependency versions recorded for that tag have to follow.
  # `for_release == 'true'` stays required, and doubles as the guard for it: a
  # post operation is by definition applied to released tags, and without the
  # flag every tag would carry the `-dev` suffix and address no released entry.
  merge-runner:
    if: ${{ github.event.inputs.dry_run == 'false' && github.event.inputs.for_release == 'true' }}
    needs:
      - expand-matrix
      - manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.31.1
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.INPUT_USERNAME }}
          password: ${{ env.INPUT_PASSWORD }}
      - name: Download Package Outputs
        uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          path: ${{ runner.temp }}/artifacts
      - name: Download Dependencies
        uses: actions/download-artifact@v4
        with:
          pattern: dependencies-*
          path: ${{ runner.temp }}/artifacts
      - name: Download Manifests
        uses: actions/download-artifact@v4
        with:
          name: manifests
          path: ${{ runner.temp }}/manifests
      - name: Merge Runner
        env:
          INPUT_CONTEXT: ${{ needs.expand-matrix.outputs.context }}
          INPUT_DEPENDENCIES_DIR: ${{ runner.temp }}/artifacts
          INPUT_MANIFESTS_FILE: ${{ runner.temp }}/manifests/manifests.json
          INPUT_POST_OPERATION: ${{ github.event.inputs.post_operation }}
        run: ${{ github.workspace }}/pack/merge_runner.sh
      - name: Generate Pull Request Token
        id: generate-prt
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_PRT_GENERATOR_ID }}
          private-key: ${{ secrets.CI_PRT_GENERATOR_KEY }}
      - name: Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-prt.outputs.token }}
          branch: "create-pull-request/merge-runner-${{ github.run_id }}"
          delete-branch: true
          commit-message: "chore: update runner by gha workflow ${{ github.run_id }}"
          title: "chore: update runner by gha workflow ${{ github.run_id }}"
          reviewers: ${{ github.actor }}
          assignees: ${{ github.actor }}
          body: |
            Update runner by GHA workflow [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
