apiVersion: loopwright.dev/v1alpha1
kind: Taskpack
metadata:
  name: auto-sync
spec:
  goal:
    candidate: Research upstream GPUStack Runner releases across cuda/vllm, cuda/sglang, rocm/vllm, rocm/sglang, cann/vllm, and cann/sglang, update writable recipes, patches, matrix, support docs, and .auto-sync/proposal.json, and pass all static candidate checks.
    noChange: Confirm subscribed upstream GPUStack Runner releases match the current catalog and support records with no eligible release-line advancement and settle cleanly as no_change.
  execution:
    mode: strict
    digests:
      pinDigests: true
  scope:
    writable:
      - .auto-sync/proposal.json
      - pack/matrix.yaml
      - pack/cuda/**
      - pack/rocm/**
      - pack/cann/**
      - docs/support-records.md
      - docs/supported-runners.md
      - README.md
    protected:
      - pack/cuda/Dockerfile.voxbox
      - pack/cann/Dockerfile.mindie
      - pack/cann/mindie-atb-models_2.3.0_linux-amd64_py3.11_torch2.1.0-abi0.tar.gz
      - pack/cann/mindie-atb-models_2.3.0_linux-arm64_py3.11_torch2.1.0-abi0.tar.gz
      - pack/cann/patches/hixl/**
      - pack/cann/patches/mindie.zip
  instructions:
    - .auto-sync/instructions.md
  upstreams:
    - id: vllm
      kind: github-release
      source: vllm-project/vllm
      watchedPaths: []
      allowPrerelease: false
    - id: sglang
      kind: github-release
      source: sgl-project/sglang
      watchedPaths: []
      allowPrerelease: false
    - id: vllm-ascend
      kind: github-release
      source: vllm-project/vllm-ascend
      watchedPaths: []
      allowPrerelease: true
  proposal:
    path: .auto-sync/proposal.json
    requiredFields:
      - schema_version
      - summary
      - subscriptions
    schemaVersion: 1
  verification:
    localChecks:
      - id: runner-proposal-json
        implementation: json-artifact.v1
      - id: runner-scope-guard
        implementation: scope.v1
      - id: runner-static-checks
        implementation: command.v1
        parameters:
          script: .auto-sync/checks/validate_candidate.sh
          timeoutSeconds: 300
          allowReadOnlyGitHubToken: false
          toolchainPaths:
            - /usr/local/bin
            - /usr/bin
          env:
            - PACK_RUN_URL
            - PYTHON_BIN
    externalGates: []
  mcp:
    servers:
      - id: github
        transport: stdio
        command: github-mcp-server
        args:
          - stdio
          - --read-only
          - --toolsets
          - repos,pull_requests,issues
        envFrom:
          GITHUB_PERSONAL_ACCESS_TOKEN: GITHUB_TOKEN
        readOnly: true
        timeoutSeconds: 60
      - id: deepwiki
        transport: http
        url: https://mcp.deepwiki.com/mcp
        readOnly: true
        timeoutSeconds: 60
  limits:
    wallTimeSeconds: 3000
    totalTokens: 20000000
    maxOutputTokens: 65536
    maxModelCalls: 256
    maxAttempts: 5
    toolTimeoutSeconds: 300
    commandTimeoutSeconds: 600
  publication:
    mode: pull_request
    targetBranch: main
    headBranchPrefix: auto-sync/
    titleTemplate: "feat(pack): sync upstream runner releases"
  memory:
    directory: .auto-sync/memory
    apply: separate-pull-request
    onNoModelBudget: deterministic-observations-only
  triggers:
    schedule: true
    workflowDispatch: true
    releasePublished: false
    commentCommands:
      - retry
      - revise
      - status
    commentPrefixes:
      - /auto-sync
  models:
    - provider: zai-coding-cn
      id: glm-5.3
      thinking: low
      samplingParams:
        temperature: 0.4
        top_p: 0.9
      apiKeyEnv: LOOPWRIGHT_PROVIDER_TOKEN
  output:
    formats:
      - json
      - github-step-summary
